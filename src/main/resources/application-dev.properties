# Development profile: turn it on with  .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
# Loads the demo data in db/demo (Karim Transport and Tongi Garments, with sample jobs) and logs more.
spring.flyway.locations=classpath:db/migration,classpath:db/demo
# Teammates merge migrations in any order, so allow an older version to run after a newer one.
spring.flyway.out-of-order=true
logging.level.app.kaaj=DEBUG
# A default admin for development only, if .env doesn't set one.
kaaj.admin.email=${KAAJ_ADMIN_EMAIL:admin@kaaj.local}
kaaj.admin.password=${KAAJ_ADMIN_PASSWORD:Admin@12345}
