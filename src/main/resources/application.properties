# ---------------------------------------------------------------------------------------------
# Kaaj – The Job · main settings. Secrets come from the .env file next to pom.xml (git-ignored).
# ---------------------------------------------------------------------------------------------
spring.application.name=kaaj

# Read extra settings from .env ("optional:" = don't fail if it's missing; read as key=value lines).
spring.config.import=optional:file:.env[.properties]

# The port is the last four digits of the student ID (22201027). The web app (Vite) forwards /api here.
server.port=${PORT:1027}

# Java 25 virtual threads: many requests at once without a big thread pool.
spring.threads.virtual.enabled=true

# PostgreSQL on this PC. Create an empty database named "kaaj" once; Flyway creates every table.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kaaj}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the database structure (src/main/resources/db/migration), so Hibernate never changes it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Uploads: verification documents up to 3 MB (the FileStore checks each kind's own limit).
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Error and form messages in Bangla (messages_bn.properties) and English (messages.properties),
# chosen by the request's Accept-Language header.
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Session cookie: not readable by JavaScript, sent only to this site.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# API docs: http://localhost:1027/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

# ---- Kaaj settings ----
# Where uploaded files are kept (git-ignored).
kaaj.files.dir=./data/uploads
# The first admin account, created at startup when there is no admin yet.
kaaj.admin.email=${KAAJ_ADMIN_EMAIL:}
kaaj.admin.password=${KAAJ_ADMIN_PASSWORD:}
# Stand-in email + password sign-up until Member-2's email codes (S5) are merged.
kaaj.auth.simple-sign-up=true
# Job posts close 30 days after publishing; the check runs every hour at minute 5.
kaaj.jobs.expiry-days=30
kaaj.jobs.expiry-cron=0 5 * * * *
# Scam screening (the trust module) decides every submitted post. Set this to true only to run the job
# module on its own, without screening (then submitted posts are published straight away).
kaaj.jobs.auto-publish=false
# The job-post assistant: drafts per employer per day (protects the free AI quota).
kaaj.jobs.drafts-per-day=20
# Only verified employers' posts go live; others wait as drafts until an admin approves them.
kaaj.jobs.require-verified-employer=true

# ---- Scam screening and moderation (trust module) ----
# Three reports take a post out of search until an admin decides; one person may send 10 reports a day.
kaaj.trust.reports-to-hold=3
kaaj.trust.reports-per-day=10
# The optional AI check of posts that pass the rules, and what happens when it fails (REVIEW or PUBLISH).
kaaj.trust.ai-check=true
kaaj.trust.when-ai-fails=REVIEW

# ---- Free AI providers (context file §13), tried in order; a provider without a key is skipped ----
# Without any key, the job-post assistant uses its templates and screening uses the rules only.
kaaj.ai.enabled=true
kaaj.ai.timeout=20s
kaaj.ai.providers[0].name=gemini
kaaj.ai.providers[0].base-url=https://generativelanguage.googleapis.com/v1beta/openai
kaaj.ai.providers[0].api-key=${GEMINI_API_KEY:}
kaaj.ai.providers[0].model=${GEMINI_MODEL:gemini-2.5-flash}
kaaj.ai.providers[1].name=groq
kaaj.ai.providers[1].base-url=https://api.groq.com/openai/v1
kaaj.ai.providers[1].api-key=${GROQ_API_KEY:}
kaaj.ai.providers[1].model=${GROQ_MODEL:openai/gpt-oss-120b}
