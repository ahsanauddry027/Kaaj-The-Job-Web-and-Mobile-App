<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.55" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- soft decorative circles -->
  <circle cx="1170" cy="270" r="120" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="1080" cy="40" r="70" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- logo: the briefcase from web/public/favicon.svg -->
  <g transform="translate(72 84) scale(2.4)">
    <rect x="6" y="18" width="52" height="38" rx="9" fill="#FFFFFF"/>
    <path d="M23 18v-4a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v4" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="27" y="32" width="10" height="7" rx="2" fill="#1D4ED8"/>
  </g>

  <text x="260" y="146" font-size="64" font-weight="800" fill="#FFFFFF"
        font-family="'Noto Sans Bengali', 'Nirmala UI', Vrinda, 'Hind Siliguri', Inter, 'Segoe UI', sans-serif">কাজ <tspan font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">· Kaaj – The Job</tspan></text>
  <text x="262" y="192" font-size="24" fill="#DBEAFE">Verified work nearby · Wages always shown · Job seekers never pay</text>

  <!-- chips -->
  <g font-size="17" font-weight="600">
    <rect x="262" y="222" width="190" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="357" y="248" fill="#FFFFFF" text-anchor="middle">Spring Boot API</text>
    <rect x="466" y="222" width="190" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="561" y="248" fill="#FFFFFF" text-anchor="middle">React web app</text>
    <rect x="670" y="222" width="210" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="775" y="248" fill="#FFFFFF" text-anchor="middle">Kotlin Android app</text>
    <rect x="894" y="222" width="190" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="989" y="248" fill="#FFFFFF" text-anchor="middle">বাংলা + English</text>
  </g>
</svg>
